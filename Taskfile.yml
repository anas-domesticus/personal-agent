version: "3"

dotenv: [".env"]

vars:
  GOLANGCI_LINT_VERSION: v2.15.0
  SQLC_VERSION: v1.31.1
  GOOSE_VERSION: v3.29.0
  GOVULNCHECK_VERSION: v1.9.0

tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - task --list

  # --- Setup --------------------------------------------------------------

  tools:
    desc: Install pinned dev tools (golangci-lint, sqlc, goose, govulncheck); mockery runs via `go tool`
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}
      - go install github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}}
      - go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}

  # --- Local services -----------------------------------------------------

  up:
    desc: Start Postgres
    cmds:
      - docker compose up -d --wait

  down:
    desc: Stop services (data is kept)
    cmds:
      - docker compose down

  db:reset:
    desc: Delete all local data and restart services
    prompt: This deletes the local database. Continue?
    cmds:
      - docker compose down -v
      - docker compose up -d --wait

  db:psql:
    desc: Open psql on the local database
    cmds:
      - docker compose exec postgres psql -U agent -d agent

  migration:new:
    desc: "Create a new migration, e.g. task migration:new -- add_runs"
    cmds:
      - goose -dir internal/store/migrations create {{.CLI_ARGS}} sql

  # --- Code generation ----------------------------------------------------

  generate:
    desc: Regenerate all generated code (protobuf API, sqlc queries and mocks)
    cmds:
      - task: proto
      - task: sqlc
      - task: mocks

  proto:
    desc: Regenerate the API's Go types and Connect code from proto/ (buf, pinned in tools/go.mod)
    sources: ["proto/**/*.proto", "buf.yaml", "buf.gen.yaml", "tools/go.mod"]
    cmds:
      - go tool -modfile=tools/go.mod buf generate

  proto:lint:
    desc: Lint proto/ and check it for changes that break existing clients (against main)
    cmds:
      - go tool -modfile=tools/go.mod buf lint
      - go tool -modfile=tools/go.mod buf format --diff --exit-code
      - |
        if git cat-file -e main:proto 2>/dev/null; then
          go tool -modfile=tools/go.mod buf breaking --against '.git#branch=main'
        fi

  sqlc:
    desc: Regenerate query code from SQL
    sources: ["internal/store/queries/*.sql", "internal/store/migrations/*.sql", "sqlc.yaml"]
    cmds:
      - sqlc generate

  mocks:
    desc: Regenerate mocks for every interface (see .mockery.yml)
    cmds:
      - go tool mockery

  # --- Build and run ------------------------------------------------------

  build:
    desc: Build agent (server and TUI)
    deps: [sqlc, proto]
    cmds:
      - go build -o bin/agent ./cmd/agent

  install:
    desc: Install the agent binary on your PATH (GOBIN, else GOPATH/bin)
    deps: [sqlc, proto]
    vars:
      BIN:
        sh: d=$(go env GOBIN); [ -n "$d" ] || d="$(go env GOPATH)/bin"; echo "$d"
    cmds:
      - go install ./cmd/agent
      - 'echo "Installed {{.BIN}}/agent. It reads its settings from the environment (see .env.example), not from .env; set MCP_CONFIG and WORKSPACE_DIR to absolute paths."'

  uninstall:
    desc: Remove the binary task install put on your PATH
    vars:
      BIN:
        sh: d=$(go env GOBIN); [ -n "$d" ] || d="$(go env GOPATH)/bin"; echo "$d"
    cmds:
      # Only remove an agent binary built from this module.
      - |
        if go version -m "{{.BIN}}/agent" 2>/dev/null | grep -q "$(go list -m)"; then
          rm "{{.BIN}}/agent" && echo "Removed {{.BIN}}/agent"
        else
          echo "No agent binary from this repo in {{.BIN}}"
        fi

  run:
    desc: "Run the server in-process and open the TUI on it (migrates on start). Flags after --, e.g. task run -- -c"
    deps: [sqlc, proto]
    cmds:
      - go run ./cmd/agent {{.CLI_ARGS}}

  serve:
    desc: Run only the server (AGENT_LISTEN, AGENT_TOKEN)
    deps: [sqlc, proto]
    cmds:
      - go run ./cmd/agent serve

  attach:
    desc: "Open the TUI on a running server, e.g. task attach -- http://host:7433 (AGENT_URL, AGENT_TOKEN)"
    cmds:
      - go run ./cmd/agent attach {{.CLI_ARGS}}

  # --- Quality ------------------------------------------------------------

  fmt:
    desc: Format code (gofmt, goimports)
    cmds:
      - golangci-lint fmt ./...

  lint:
    desc: Run golangci-lint (see .golangci.yml) and buf lint
    cmds:
      - golangci-lint run ./...
      - task: proto:lint

  test:
    desc: Run unit and database tests (needs Docker for testcontainers)
    deps: [sqlc]
    cmds:
      - go test -race ./... {{.CLI_ARGS}}

  test:unit:
    desc: Run unit tests only (no Docker, no network)
    cmds:
      - go test -race -short ./... {{.CLI_ARGS}}

  test:live:
    desc: Run live tests against OpenRouter (costs a little; needs OPENROUTER_API_KEY)
    cmds:
      - go test -tags live -run Live -count=1 ./... {{.CLI_ARGS}}

  cover:
    desc: Run tests with coverage and print a per-function summary
    cmds:
      - go test -short -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  docs:check:
    desc: Check every package has a doc comment and is in docs/architecture.md
    cmds:
      - ./scripts/check-docs.sh

  generate:check:
    desc: Fail if generated code (sqlc, mocks) or go.mod is out of date
    cmds:
      - task: generate
      - go mod tidy
      - cd tools && go mod tidy
      - git diff --exit-code -- go.mod go.sum tools/go.mod tools/go.sum internal/gen internal/store/db internal/mocks '**/mocks_test.go'
      - test -z "$(git status --porcelain -- internal/gen internal/store/db internal/mocks '**/mocks_test.go')"

  vuln:
    desc: Check dependencies for known vulnerabilities
    cmds:
      - ./scripts/vuln.sh

  check:fast:
    desc: Quick loop while working (no Docker) - lint issues new since HEAD, unit tests, docs
    cmds:
      - golangci-lint run --new-from-rev=HEAD ./...
      - go test -short ./...
      - task: docs:check

  check:
    desc: Everything a change must pass before it is done (CI runs this)
    cmds:
      - task: generate:check
      - task: docs:check
      - task: lint
      - task: vuln
      - task: test
