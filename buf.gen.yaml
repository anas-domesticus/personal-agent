# Generates Go types and Connect clients/handlers from proto/ into
# internal/gen. Plugins run from tools/go.mod, so versions are pinned and
# nothing needs installing: task proto
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/anas-domesticus/personal-agent/internal/gen
plugins:
  - local: [go, tool, -modfile=tools/go.mod, protoc-gen-go]
    out: internal/gen
    opt: paths=source_relative
  - local: [go, tool, -modfile=tools/go.mod, protoc-gen-connect-go]
    out: internal/gen
    opt: paths=source_relative
