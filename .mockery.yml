# Mocks for every interface under internal/, generated by `task mocks`.
# Each package's mocks go in its own mocks_test.go, so they're visible to that
# package's tests (internal and external) and never ship in the binary.
# Don't edit generated files; change the interface and regenerate.
template: testify
all: true
dir: "{{.InterfaceDir}}"
filename: mocks_test.go
structname: "Mock{{.InterfaceName}}"
pkgname: "{{.SrcPackageName}}"
formatter: goimports
log-level: warn
packages:
  github.com/anas-domesticus/personal-agent/internal:
    config:
      recursive: true
      # sqlc's generated DBTX; the database layer is tested against Postgres.
      exclude-subpkg-regex: ["store/db$"]
  # Third-party interfaces our code consumes directly. These go in a shared,
  # non-test package so any package's tests can use them.
  github.com/cloudwego/eino/components/embedding:
    config: &external
      all: false
      dir: internal/mocks
      pkgname: mocks
      filename: "{{.SrcPackageName}}_{{.InterfaceName | snakecase}}.go"
    interfaces:
      Embedder: {}
  github.com/cloudwego/eino/components/model:
    config: *external
    interfaces:
      ToolCallingChatModel: {}
  github.com/cloudwego/eino/components/tool:
    config: *external
    interfaces:
      InvokableTool: {}
